parameters:
  - name: variableGroup
    type: string

  - name: secretNames
    type: object

  - name: envFile
    type: string
    default: .env

  - name: workingDirectory
    type: string

steps:
  - bash: |
      az pipelines variable-group list | jq -r --arg NAME "$NAME" '.[] | select(.name == $NAME).variables' > var_group.json
      cat var_group.json
    displayName: Get Variable Group
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      NAME: ${{ parameters.variableGroup }}

  - bash: |
      cat var_group.json  | jq -r 'to_entries[] | select(.value.isSecret != true) | "\(.key)=\(.value.value)"' >> ${{ parameters.envFile }}
      cat ${{ parameters.envFile }}
    displayName: Generate Config
    workingDirectory: ${{ parameters.workingDirectory }}
    env:
      VAR_GROUP: $(VAR_GROUP)

  - ${{ if gt(length(parameters.secretNames), 0) }}:
    - bash: |
        cat var_group.json | jq -r 'to_entries[] | select(.value.isSecret == true) | "\(.key)=$\(.key)"' | envsubst >> ${{ parameters.envFile }}
        cat ${{ parameters.envFile }}
      displayName: Generate Secret
      workingDirectory: ${{ parameters.workingDirectory }}
      env:
        VAR_GROUP: $(VAR_GROUP)
        ${{ each name in parameters.secretNames }}:
          ${{ name }}: $(${{ name }})